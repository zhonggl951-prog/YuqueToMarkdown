<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" style="border-radius:12px;background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="20" y="20" width="840" height="460" rx="10" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" filter="url(#shadow)"/>

  <!-- Browser Window Header -->
  <path d="M 20 30 Q 20 20 30 20 L 850 20 Q 860 20 860 30 L 860 56 L 20 56 Z" fill="#ffffff"/>
  <circle cx="44" cy="38" r="5" fill="#ef4444"/>
  <circle cx="60" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="38" r="5" fill="#10b981"/>
  <text x="440" y="42" font-size="11" fill="#71717a" text-anchor="middle" font-weight="500">YuqueToMarkdown — 语雀知识库导出转 Markdown 工具</text>
  <line x1="20" y1="56" x2="860" y2="56" stroke="#f4f4f5" stroke-width="1"/>

  <!-- Main Card Container -->
  <rect x="180" y="86" width="520" height="364" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" filter="url(#shadow)"/>

  <!-- Top App Navigation -->
  <rect x="206" y="108" width="22" height="22" rx="5" fill="#18181b"/>
  <text x="217" y="124" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Y</text>
  <text x="236" y="124" font-size="13" fill="#09090b" font-weight="600">YuqueToMarkdown</text>
  
  <text x="674" y="123" font-size="11" fill="#71717a">GitHub ↗</text>

  <!-- Upload Drag & Drop Box -->
  <rect x="206" y="146" width="468" height="130" rx="10" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="440" cy="182" r="18" fill="#f4f4f5"/>
  <!-- Upload arrow icon -->
  <path d="M 440 174 L 440 190 M 434 180 L 440 174 L 446 180" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="214" font-size="13" fill="#18181b" text-anchor="middle" font-weight="600">选择或拖入 .lakebook 文件</text>
  <text x="440" y="234" font-size="11" fill="#a1a1aa" text-anchor="middle">自动还原多级文件夹结构 · 离线并发抓取图片</text>

  <!-- Options Bar -->
  <line x1="206" y1="294" x2="674" y2="294" stroke="#f4f4f5" stroke-width="1"/>
  
  <circle cx="218" cy="316" r="6" fill="#18181b"/>
  <text x="218" y="319" font-size="8" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="232" y="320" font-size="11" fill="#52525b">离线图片至 assets/</text>

  <circle cx="370" cy="316" r="6" fill="#18181b"/>
  <text x="370" y="319" font-size="8" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="384" y="320" font-size="11" fill="#52525b">目录索引 (_index.md)</text>

  <circle cx="530" cy="316" r="6" fill="#18181b"/>
  <text x="530" y="319" font-size="8" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="544" y="320" font-size="11" fill="#52525b">YAML Frontmatter</text>

  <!-- Progress / Result Box -->
  <rect x="206" y="344" width="468" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="228" cy="368" r="7" fill="#10b981"/>
  <text x="228" y="372" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="244" y="372" font-size="12" fill="#0f172a" font-weight="bold">转换完成</text>
  <text x="306" y="372" font-size="11" fill="#64748b">文档: 302 · 目录: 71 · 图片: 282 · 耗时 3.4s</text>

  <!-- Action Button -->
  <rect x="224" y="390" width="432" height="26" rx="5" fill="#18181b"/>
  <text x="440" y="407" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">下载 Markdown 知识库压缩包 (.zip)</text>
</svg>
